<script>
const TZ='Africa/Cairo',DG='٠١٢٣٤٥٦٧٨٩',ar=s=>String(s).replace(/\d/g,d=>DG[d]),en=s=>String(s).replace(/[٠-٩]/g,d=>DG.indexOf(d)).replace('٫','.');

let S={v:2,day:'',tasks:[],back:[],hist:{},pomo:0,rem:2,th:'d',pf:25,pb:5,note:'',notes:[],done:[],fl:[],subs:['فيزياء','كيمياء','أحياء','إنجليزي','عربي'],csb:'',cur:null,goal:6,tab:1,sv:'b'},fq=0,AC;
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||localStorage.getItem('madhakirati.v1')||'{}'))}catch(e){}

 if(S.day){
  S.hist[S.day]={p:dn(),d:dn(),pm:S.pomo,b:S.back.length,tk:S.tasks.filter(x=>x.s=='done').map(x=>({t:x.t,q:x.q,k:1,sb:x.sb||''}))}}
 const ks=Object.keys(S.hist).sort();while(ks.length>120)delete S.hist[ks.shift()];if(S.fl.length>3000)S.fl=S.fl.slice(-3000);S.tasks=S.tasks.filter(x=>x.s!='done');S.pomo=0;S.day=t;save()}

function ask(m,fn,no){dlg(`<h2>تأكيد</h2><p>${m}</p><div class="r"><button class="bt red" id="y">نعم، متأكد</button><button class="bt" id="n">إلغاء</button></div>`);$('#y').onclick=()=>{closeD();fn()};$('#n').onclick=()=>{closeD();no&&no()}}

function al(m){const a=$('#al');a.innerHTML=`<b>${m}</b><button class="bt" id="ok">حسنًا</button>`;a.classList.add('on');$('#ok').onclick=()=>{a.classList.remove('on');stopBell();const n=LN();if(n)try{n.removeAllDeliveredNotifications()}catch(e){}}}
let bm=null;
function stopBell(){try{if(bm){bm.gain.cancelScheduledValues(0);bm.gain.setValueAtTime(0,AC.currentTime);bm=null}navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();stopBell();
 const c=AC.createDynamicsCompressor(),g=AC.createGain();g.gain.value=1;g.connect(c);c.connect(AC.destination);bm=g;const t0=AC.currentTime+.05;
 for(let i=0;i<20;i++){const f=i%2?1175:880,t=t0+i*.5;[1,2.76,5.4,8.93].forEach((m,j)=>{const o=AC.createOscillator(),e=AC.createGain();o.type=j?'sine':'triangle';o.frequency.value=f*m;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.55/(j+1),t+.01);e.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(e);e.connect(g);o.start(t);o.stop(t+.65)})}
 navigator.vibrate&&navigator.vibrate(Array(10).fill([700,300]).flat())}catch(e){}}
/* العرض */
const MK={start:['b','▶','ابدأ العمل'],done:['g','✓','تم'],post:['r','✗','أجّل'],back:['n','↩','إرجاع'],del:['x','×','حذف']};
const mk=(a,id)=>`<button class="m ${MK[a][0]}" data-a="${a}" data-id="${id}" title="${MK[a][2]}">${MK[a][1]}</button>`;

function renderMx(){const keep={};document.querySelectorAll('#mx input').forEach(i=>keep[i.form.dataset.q]=i.value);
 $('#mx').innerHTML=[1,2,3,4].map(q=>{const L=S.tasks.filter(t=>t.q==q&&t.s=='todo');
 return`<div class="q q${q}"><h4>${QN[q]}<small>${ar(L.length)}</small></h4><ul>${L.map(t=>row(t,['start','done','post','del'])).join('')}</ul><form data-q="${q}"><input name="t" autocomplete="off" placeholder="＋ مهمة (افصل عدة مهام بـ ؛)"><button class="bt" type="submit">＋</button></form></div>`}).join('');
 document.querySelectorAll('#mx input').forEach(i=>{i.value=keep[i.form.dataset.q]||''});
 if(fq){const i=$(`#mx form[data-q="${fq}"] input`);i&&i.focus()}}
function renderBd(){const f=(s,A)=>S.tasks.filter(t=>t.s==s).map(t=>row(t,A,1)).join('')||'<li style="color:var(--mu);border:0">—</li>';
 $('#l1').innerHTML=f('doing',['done','post','back']);$('#l2').innerHTML=f('done',['back']);$('#wn').textContent=S.tasks.filter(t=>t.s=='doing').length>5?'⚠ أكثر من ٥ قيد العمل':''}
const age=sn=>{const d=Math.max(0,Math.round((Date.parse(today()+'T00:00:00Z')-Date.parse((sn||today())+'T00:00:00Z'))/864e5));return[d,d==0?'اليوم':d==1?'أمس':d==2?'منذ يومين':'منذ '+ar(d)+(d<=10?' أيام':' يومًا')]};
function renderBk(){$('#b3').textContent=S.back.length?ar(S.back.length):'';if(S.tab==3)renderLst()}
const bkHtml=()=>'<ul id="bl">'+(S.back.map(b=>{const[d,l]=age(b.sn);return`<li class="${b.p?'pp':''}"><i class="d q${b.q}"></i><span class="tt">${esc(b.t)}<small class="ag${d>=3?' old':''}">${b.sb?esc(b.sb)+' • ':''}${l}</small></span><span class="ms"><button class="m g" data-a="bok" data-id="${b.id}" title="تم التنفيذ">✓</button></span></li>`}).join('')||'<li style="color:var(--mu);border:0">لا تراكمات 🎉</li>')+'</ul>';
function dnHtml(){const L=S.done.slice().sort((a,b)=>b.at-a.at),g={};L.forEach(x=>(g[x.d]=g[x.d]||[]).push(x));const lb=k=>new Intl.DateTimeFormat('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(k+'T12:00:00'));
 return Object.keys(g).sort().reverse().map(k=>`<h4 class="dh">${lb(k)} <small>(${ar(g[k].length)})</small></h4><ul>${g[k].map(x=>`<li><i class="d q${x.q}"></i><span class="tt">${esc(x.t)}${x.sb?`<small class="ag">${esc(x.sb)}</small>`:''}</span><small style="color:var(--mu)">${QN[x.q]}</small></li>`).join('')}</ul>`).join('')||'<p style="color:var(--mu)">لا منجزات بعد — كل مهمة تنجزها تُحفظ هنا ولا تُحذف أبدًا.</p>'}
function renderLst(){const v=S.sv=='d'?'d':'b';$('#s3a').classList.toggle('on',v=='b');$('#s3b').classList.toggle('on',v=='d');$('#s3a').textContent='التراكمات ('+ar(S.back.length)+')';$('#s3b').textContent='المنجزات ('+ar(S.done.length)+')';$('#lst').innerHTML=v=='d'?dnHtml():bkHtml()}
function renderSj(){$('#sj').innerHTML='<span class="cl">المادة:</span>'+['',...S.subs].map(x=>`<button class="chp${(S.csb||'')==x?' on':''}" data-sb="${esc(x)}">${x?esc(x):'بدون'}</button>`).join('')+'<button class="chp" id="se" title="تعديل المواد">✎</button>'}
function subDlg(){dlg(`<h2>المواد</h2><div class="dl">${S.subs.map((x,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:.3rem 0"><span>${esc(x)}</span><button class="bt" data-a="sdel" data-id="${i}">حذف</button></div>`).join('')||'<p style="color:var(--mu)">لا مواد بعد</p>'}</div><div style="display:flex;gap:.4rem;margin-top:.7rem"><input id="si" placeholder="مادة جديدة" style="flex:1"><button class="bt pri" id="sa">＋ إضافة</button></div><div class="r"><button class="bt" id="sx2">إغلاق</button></div>`);
 $('#sa').onclick=()=>{const v=$('#si').value.trim();if(!v)return;ask(`إضافة المادة «${esc(v)}»؟`,()=>{if(!S.subs.includes(v))S.subs.push(v);save();all();subDlg()})};$('#sx2').onclick=closeD}
function renderFocus(){const dg=S.tasks.filter(t=>t.s=='doing'),gl=S.goal>0?S.goal:6;if(S.cur&&!dg.some(t=>t.id==S.cur))S.cur=null;

 $('#gl').innerHTML=`<div class="gt">هدف اليوم: <input id="gi" value="${ar(gl)}"> جلسات — ${ar(S.pomo)} / ${ar(gl)}</div><div id="gb"><i style="width:${Math.min(100,S.pomo/gl*100)}%"></i></div>`}
function renderRv(){const T=today(),days=[...Array(7)].map((_,i)=>new Date(Date.parse(T+'T12:00:00Z')-(6-i)*864e5).toISOString().slice(0,10)),W=new Set(days),
 fl=S.fl.filter(x=>W.has(x.d)),dd=S.done.filter(x=>W.has(x.d)),sm=a=>a.reduce((s,x)=>s+x.m,0),fm=m=>m>=60?ar(Math.floor(m/60))+' س '+ar(m%60)+' د':ar(m)+' د',

 const names=[...new Set([...S.subs,...fl.map(x=>x.sb||''),...dd.map(x=>x.sb||''),...S.back.map(x=>x.sb||'')])];
 const rows=names.map(n=>({n,m:sm(fl.filter(x=>(x.sb||'')==n)),d:dd.filter(x=>(x.sb||'')==n).length,b:S.back.filter(x=>(x.sb||'')==n).length})).filter(r=>r.m||r.d||r.b).sort((a,b)=>b.m-a.m);
 const mx=Math.max(1,...rows.map(r=>r.m)),pd=days.map(k=>({k,m:sm(fl.filter(x=>x.d==k)),d:dd.filter(x=>x.d==k).length})),mxd=Math.max(1,...pd.map(x=>x.m)),card=(v,l)=>`<div class="rc"><b>${v}</b><small>${l}</small></div>`;

function renderHd(){const o=S.tasks.filter(t=>t.s=='todo').length,d=S.tasks.filter(t=>t.s=='doing').length,k=S.tab>=1&&S.tab<=5?S.tab:1,T={1:['اليوم',`${ar(o)} مفتوحة • ${ar(d)} قيد العمل • ${ar(S.done.filter(x=>x.d==today()).length)} منجزة اليوم`],2:['التركيز','جلسات اليوم '+ar(S.pomo)],3:['التراكمات',`${ar(S.back.length)} متراكمة • ${ar(S.done.length)} منجزة`],4:['الملاحظات',ar(S.notes.length)+' ملاحظة'],5:['المراجعة','آخر ٧ أيام']}[k];$('#h1t').textContent=T[0];$('#h1s').textContent=T[1]}

/* الأفعال */
const MS={doing:'بدأتَ العمل',done:'تم الإنجاز ✓',todo:'أُعيدت للمصفوفة',pile:'أُجّلت إلى التراكم'};
function postpone(t){const i=S.tasks.indexOf(t),b={id:uid(),t:t.t,q:t.q,sn:today(),p:1,sb:t.sb||''};if(S.cur==t.id)S.cur=null;S.tasks.splice(i,1);S.back.push(b);save();all();toast('أُجّلت إلى جامع التراكمات: '+esc(t.t),()=>{S.back=S.back.filter(x=>x!=b);S.tasks.splice(i,0,t);save();all()})}

function set(t,s){const p=t.s;t.s=s;if(s=='doing')S.cur=t.id;else if(S.cur==t.id)S.cur=null;if(s=='done')arc(t);else if(p=='done')unarc(t);save();all();toast(MS[s]+': '+esc(t.t),()=>{t.s=p;if(p=='done')arc(t);else if(s=='done')unarc(t);save();all()})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,t=S.tasks.find(x=>x.id==id),k=S.back.find(x=>x.id==id);
 if(a=='start')ask(`بدء العمل في «${esc(t.t)}» الآن؟`,()=>set(t,'doing'));else if(a=='done')ask(`تأكيد أنك أنجزت «${esc(t.t)}»؟`,()=>set(t,'done'));else if(a=='back')ask(`إرجاع «${esc(t.t)}» إلى المصفوفة؟`+(t.s=='done'?' ستُزال من جامع المنجزات لأنها لم تنتهِ.':''),()=>set(t,'todo'));

 else if(a=='sdel'){const nm=S.subs[+id];ask(`حذف المادة «${esc(nm)}»؟ المهام الحالية تحتفظ باسمها.`,()=>{S.subs.splice(+id,1);if(S.csb==nm)S.csb='';save();all();subDlg()})}
});
